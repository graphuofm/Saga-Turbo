[workspace]
resolver = "2"
members = [
    "crates/saga-core",
    "crates/saga-rules",
    "crates/saga-topology",
    "crates/saga-sample",
    "crates/saga-introspect",
    "crates/saga-io",
    "crates/saga-host",
    "crates/saga-cli",
    "crates/saga-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# License: all rights reserved; see LICENSE (workspace crates use license-file)
repository = "https://github.com/graphuofm/SAGA2.0"
authors = ["Jiacheng Ding <jding2@memphis.edu>", "Xiaofei Zhang <xiaofei.zhang@memphis.edu>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "wrap_help"] }
sysinfo = "0.33"
libc = "0.2"
rayon = "1.10"
rand = "0.8"
rand_pcg = "0.3"
humansize = "2"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
owo-colors = "4"

saga-core = { path = "crates/saga-core" }
saga-rules = { path = "crates/saga-rules" }
saga-topology = { path = "crates/saga-topology" }
saga-sample = { path = "crates/saga-sample" }
saga-introspect = { path = "crates/saga-introspect" }
saga-io = { path = "crates/saga-io" }
saga-host = { path = "crates/saga-host" }

[profile.release]
lto = "thin"
codegen-units = 1
